#
# ad_obj_ai.conf - MS Windows AD Objects
# GenAI / LLM access layer settings (Phase 2, v5.0.0).
#
# THIS APP SHIPS WITH AI DISABLED.  With the stanza below untouched every AI
# surface (adexplain, adtriage, adnl2spl) runs its deterministic, rule-based
# template path and the app is fully functional.  Nothing here reaches a
# network until an administrator sets enabled = 1 AND selects a provider.
#
# NEVER put a credential in this file.  There is deliberately no setting that
# accepts a key, token, or password.  The API credential is read at search time
# from Splunk's encrypted storage/passwords store, keyed by secret_realm +
# secret_username below.  See README.txt section "5.0.0 GenAI / LLM (Phase 2)".
#
# Copy this stanza to local/ad_obj_ai.conf to change it; local wins over default.
# Setting documentation: README/ad_obj_ai.conf.spec
#

[ai]

## Master switch. 0 = deterministic template narratives only (ship default).
enabled = 0

## none | local_dsdl | external_api
##   none         - no model is called; template path only
##   local_dsdl   - DSDL / Ollama-style local generate endpoint (no credential)
##   external_api - generic external HTTPS chat-completions API (bearer credential)
provider = none

## Full URL of the model endpoint. Empty by default - no endpoint is implied.
## local_dsdl accepts http:// or https://; external_api is https:// only.
endpoint_url =

## Model identifier passed to the provider, e.g. a local model tag or an API
## model name. Empty by default.
model_name =

## Hard character budget for the assembled prompt. The prompt is truncated to
## this length; grounding fields are dropped from the end to stay inside it.
max_input_chars = 6000

## Hard character budget applied to validated model output before it is emitted.
max_output_chars = 2000

## Per-call socket timeout in seconds. On timeout the row falls back to the
## template narrative with ai_status = template_timeout.
timeout_seconds = 20

## Sampling temperature. 0 keeps narratives reproducible; leave it at 0 unless
## you have a reason not to.
temperature = 0

## Write one JSON audit record per invocation to
## $SPLUNK_HOME/var/log/splunk/ad_obj_llm_audit.log
## (prompt SHA-256 only - never the prompt text, never the response text).
## When this is 1 and the audit log cannot be opened, the model call is REFUSED
## and the template path is used instead (ai_status = template_audit_unavailable).
audit_enabled = 1

## Rotation of the audit log.
audit_log_max_bytes = 10485760
audit_log_backup_count = 5

## storage/passwords coordinates of the API credential. These are a NAME and a
## REALM only - the secret value itself never appears in any .conf file.
## Create the credential with:
##   Settings > Credentials > Add new  (app: ms_windows_ad_objects)
## or the REST equivalent documented in README.txt.
secret_realm = ms_windows_ad_objects
secret_username = ad_obj_llm_api_key

## Comma-separated allowlist. ONLY these field names may be copied out of a
## search result and into a prompt. Everything else - including _raw, objectSid,
## objectGUID, and any field not named here - is dropped before prompt assembly.
## Values are additionally scanned and masked for credential-shaped content.
## Shorten this list to tighten what can leave your environment; do not add
## _raw or free-text event fields.
allowed_grounding_fields = entity,entity_type,domain,risk_type,risk_score,model,model_version,evidence,mitre_technique_id,first_seen,last_scored,risk_types,peak_risk_score,avg_risk_score,risk_rows,distinct_risk_types,cn,sAMAccountName,displayName,distinguishedName,dn,dn_path,OU,objectClass,objectCategory,user_type,description,title,department,operatingSystem,userAccountControl,uac_details,uac_bin_map,adminCount,isCriticalSystemObject,isDeleted,accountExpires,pwdLastSet,lastLogon,lastLogonTimestamp,logonCount,badPwdCount,lockoutTime,primaryGroupID,servicePrincipalName,whenCreated,whenChanged,member,memberOf,membercount,groupType_Name,group_nesting_chain,nesting_chain,nesting_depth,min_depth,critical_group,critical_groups,critical_reach,reach_count,path,change_count,change_summary,recent_changes,changed_attributes,eventcode_summary,logon_type_summary,off_hours,date_day,feature_set
