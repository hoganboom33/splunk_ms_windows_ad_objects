#
# commands.conf - MS Windows AD Objects
# GenAI / LLM custom search commands (Phase 2, v5.0.0).
#
# All three commands are READ-ONLY narration helpers:
#   * they add fields to rows that are already in the pipeline,
#   * they never write to an index, a lookup, or the KV Store,
#   * they never dispatch, eval, exec, or shell out to anything, and
#   * adnl2spl returns generated SPL as a STRING FIELD ONLY - it is displayed
#     for human review and is never executed by this app.
#
# Every command is gated on the ad_obj_can_use_ai capability (authorize.conf)
# and behaves deterministically when ad_obj_ai.conf has enabled = 0, which is
# the ship default.
#
# local = true keeps execution on the search head: the commands need the
# search's session key for storage/passwords and write the audit log to
# $SPLUNK_HOME/var/log/splunk on the search head.
#

## Plain-English narrative for an AD entity, grounded on the passed-in row.
[adexplain]
filename = adexplain.py
chunked = true
python.version = python3
local = true
is_risky = false

## Who / what / when / blast-radius triage paragraph for AD_Obj_Risk rows.
[adtriage]
filename = adtriage.py
chunked = true
python.version = python3
local = true
is_risky = false

## Natural language -> SUGGESTED SPL. Returns a string field; never executes it.
[adnl2spl]
filename = adnl2spl.py
chunked = true
python.version = python3
local = true
is_risky = false
