## MS AD Objects - Machine Learning Risk Scores - Phase 1 (v5.0.0) ##
## first_seen / last_scored are stored as epoch seconds and declared "number" so the
## retention and drift searches can compare them numerically with relative_time().
[AD_Obj_Risk_kv]
enforceTypes = false
field.entity = string
field.entity_type = string
field.domain = string
field.risk_type = string
field.risk_score = number
field.model = string
field.model_version = string
field.evidence = string
field.mitre_technique_id = string
field.first_seen = number
field.last_scored = number
accelerated_fields.entity = { "entity" : 1 }
accelerated_fields.risk_scored = { "risk_type" : 1, "last_scored" : -1 }