#
# authorize.conf - MS Windows AD Objects
# GenAI / LLM capability (Phase 2, v5.0.0).
#
# ad_obj_can_use_ai gates the adexplain, adtriage and adnl2spl search commands.
# Each command verifies the capability against the invoking user before it does
# any work, and DENIES when the capability is absent OR when the check itself
# cannot be completed (fail-closed - an unverifiable identity is a denied one).
#
# ADMINISTRATOR ACTION REQUIRED.  Out of the box only the admin role holds this
# capability.  To let an analyst team use the AI panels, either:
#   (a) assign them the "ad_obj_ai_user" role defined below (it imports "user"),
#       via Settings > Roles, or
#   (b) add   ad_obj_can_use_ai = enabled   to their existing role in your own
#       local/authorize.conf.
#
# Note that holding this capability only permits *invoking* the commands. With
# ad_obj_ai.conf enabled = 0 (ship default) the commands still produce the
# deterministic template narratives and no data leaves the instance.
#

[capability::ad_obj_can_use_ai]

## Purpose-built role: standard user plus permission to run the AI commands.
[role_ad_obj_ai_user]
importRoles = user
ad_obj_can_use_ai = enabled

## Splunk administrators get it by default so the shipped dashboards work.
[role_admin]
ad_obj_can_use_ai = enabled
