###################################################################################
#####          Machine Learning Models - Phase 1 (v5.0.0)                     #####
#####  Prerequisite: Splunk Machine Learning Toolkit (MLTK) 5.4 or later, plus #####
#####       the "AD Objects - ML Feature - ..." Phase 0 searches enabled and   #####
#####       at least 30 days of feature rows in the summary index.            #####
#####  Ship-disabled (disabled = 1).  Crons are staggered 02:05-03:35 so every #####
#####       model search runs AFTER the 01:05-01:35 feature searches.          #####
#####  Models are written to the app namespace (into app:<model>) so every     #####
#####       user of this app can apply them.                                   #####
#####  All model output lands in the AD_Obj_Risk KV Store lookup               #####
#####       (collection AD_Obj_Risk_kv) with MITRE ATT&CK technique ids so it  #####
#####       routes through the existing severity/critical-object workflow.     #####
###################################################################################

#- ML Model - weekly DensityFunction baseline of per-account AD change velocity -#
[AD_Obj_ML_ChangeVelocity_Fit]
action.email.useNSSubject = 1
alert.suppress = 0
alert.track = 0
cron_schedule = 5 2 * * 0
description = ML model fit (weekly, Sunday 02:05). Trains a per-account DensityFunction baseline on 30 days of the "entity_change_velocity" feature set so the change-velocity apply search can score the admin who normally makes 3 changes and suddenly makes 300. Accounts with fewer than 7 distinct days of feature data are dropped before the fit so low-cardinality entities cannot produce a degenerate distribution. Model is saved to the app namespace as ad_obj_change_velocity_df. Requires MLTK 5.4+.
dispatch.earliest_time = -30d@d
dispatch.latest_time = @d
display.general.type = statistics
display.page.search.mode = fast
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 1
run_on_startup = false
request.ui_dispatch_app = ms_windows_ad_objects
request.ui_dispatch_view = search
search = index=`ms_ad_obj_ml_summary_index` feature_set=entity_change_velocity\
| fields _time,date_day,admin_user,change_count,off_hours_changes,off_hours_ratio,dc_eventcodes,dc_obj_types,dc_targets,dc_source_hosts\
| eval admin_user=lower(admin_user), change_count=tonumber(change_count)\
| where isnotnull(admin_user) AND admin_user!="" AND isnotnull(change_count)\
| eventstats dc(date_day) AS days_observed by admin_user\
| where days_observed>=7\
| fields - days_observed\
| fit DensityFunction change_count by "admin_user" dist=auto threshold=`ms_ad_obj_risk_threshold` show_density=true into app:ad_obj_change_velocity_df\
| stats count AS training_rows, dc(admin_user) AS modeled_entities, min(date_day) AS train_start, max(date_day) AS train_end\
| eval model="ad_obj_change_velocity_df", model_version="1.0.0", algorithm="DensityFunction", fit_completed=strftime(now(),"%Y-%m-%d %H:%M:%S")\
| table model,model_version,algorithm,fit_completed,train_start,train_end,modeled_entities,training_rows
disabled = 1

#- ML Model - daily scoring of yesterday's change velocity against the baseline -#
[AD_Obj_ML_ChangeVelocity_Apply]
action.email.useNSSubject = 1
alert.suppress = 0
alert.track = 0
cron_schedule = 15 2 * * *
description = ML model apply (daily 02:15). Scores yesterday's "entity_change_velocity" feature rows against the ad_obj_change_velocity_df DensityFunction baseline and writes every IsOutlier row into the AD_Obj_Risk KV Store lookup as risk_type=change_velocity, MITRE T1098. risk_score = 1/(1+ProbabilityDensity) so a vanishing probability density scores near 1.0. The _key is <risk_type>:<entity_type>:<entity>:<scored_day> so a re-run upserts instead of duplicating. Requires MLTK 5.4+ and a completed AD_Obj_ML_ChangeVelocity_Fit.
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
display.general.type = statistics
display.page.search.mode = fast
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 1
run_on_startup = false
request.ui_dispatch_app = ms_windows_ad_objects
request.ui_dispatch_view = search
search = index=`ms_ad_obj_ml_summary_index` feature_set=entity_change_velocity\
| fields _time,date_day,admin_user,change_count,off_hours_changes,off_hours_ratio,dc_eventcodes,dc_obj_types,dc_targets,dc_source_hosts,act_created,act_deleted,act_modified,act_added,act_removed,act_moved\
| eval admin_user=lower(admin_user), change_count=tonumber(change_count)\
| where isnotnull(admin_user) AND admin_user!="" AND isnotnull(change_count)\
| apply ad_obj_change_velocity_df threshold=`ms_ad_obj_risk_threshold`\
| rename "IsOutlier(change_count)" AS is_outlier, "ProbabilityDensity(change_count)" AS prob_density\
| where is_outlier=1\
| eval prob_density=if(isnull(prob_density),0,tonumber(prob_density))\
| eval risk_score=round(1/(1+prob_density),4)\
| eval entity=admin_user\
| eval entity_parts=split(entity,"\\")\
| eval domain=if(mvcount(entity_parts)>1,mvindex(entity_parts,0),"NA")\
| eval entity_type="user", risk_type="change_velocity", model="ad_obj_change_velocity_df", model_version="1.0.0", mitre_technique_id="T1098"\
| eval evidence="change_count=".change_count."; off_hours=".off_hours_changes." (ratio ".off_hours_ratio."); dc_targets=".dc_targets."; dc_obj_types=".dc_obj_types."; dc_eventcodes=".dc_eventcodes."; dc_source_hosts=".dc_source_hosts."; actions created/deleted/modified/added/removed/moved=".act_created."/".act_deleted."/".act_modified."/".act_added."/".act_removed."/".act_moved."; probability_density=".prob_density\
| eval scored_day=date_day\
| eval first_seen=strptime(date_day,"%Y-%m-%d"), last_scored=now()\
| eval _key=risk_type.":".entity_type.":".entity.":".scored_day\
| table _key,entity,entity_type,domain,risk_type,risk_score,model,model_version,evidence,mitre_technique_id,first_seen,last_scored\
| outputlookup append=true key_field=_key AD_Obj_Risk
disabled = 1

#- ML Model - weekly KMeans peer grouping of accounts on their logon-type vector -#
[AD_Obj_ML_PeerGroup_Fit]
action.email.useNSSubject = 1
alert.suppress = 0
alert.track = 0
cron_schedule = 25 2 * * 0
description = ML model fit (weekly, Sunday 02:25). Aggregates 30 days of the "logon_type_vector" feature set into a per-account, scale-invariant authentication profile (logon-type ratios, failure ratio, off-hours ratio, log host spread), joins each account to its OU from the AD_Obj_User KV Store lookup and adds two numeric OU-structure features (OU depth and log OU peer-population), then fits KMeans k=8 into the app namespace as ad_obj_peer_kmeans. Ratios are used instead of raw counts so a busy service account and a quiet desktop user cluster on behaviour, not volume. Requires MLTK 5.4+.
dispatch.earliest_time = -30d@d
dispatch.latest_time = @d
display.general.type = statistics
display.page.search.mode = fast
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 1
run_on_startup = false
request.ui_dispatch_app = ms_windows_ad_objects
request.ui_dispatch_view = search
search = index=`ms_ad_obj_ml_summary_index` feature_set=logon_type_vector\
| eval logon_user=lower(logon_user)\
| where isnotnull(logon_user) AND logon_user!=""\
| stats sum(total_events) AS total_events, sum(failure_count) AS failure_count, sum(off_hours_events) AS off_hours_events, sum(lt_interactive) AS lt_interactive, sum(lt_network) AS lt_network, sum(lt_batch) AS lt_batch, sum(lt_service) AS lt_service, sum(lt_remote_interactive) AS lt_remote_interactive, sum(lt_cached_interactive) AS lt_cached_interactive, sum(lt_network_cleartext) AS lt_network_cleartext, sum(lt_new_credentials) AS lt_new_credentials, max(dc_dest_hosts) AS dc_dest_hosts, max(dc_src_hosts) AS dc_src_hosts, dc(date_day) AS days_observed by logon_user\
| where days_observed>=7 AND total_events>=5\
| lookup AD_Obj_User lookup_usr AS logon_user OUTPUT OU AS user_ou, cn AS user_cn, domain AS user_domain, user_type AS user_type\
| eval user_ou=mvindex(user_ou,0), user_domain=mvindex(user_domain,0)\
| eval user_ou=if(isnull(user_ou) OR user_ou=="","UNRESOLVED",lower(user_ou))\
| eval ou_depth=mvcount(split(user_ou,","))\
| eventstats dc(logon_user) AS ou_peer_size by user_ou\
| eval r_interactive=round(lt_interactive/total_events,6), r_network=round(lt_network/total_events,6), r_batch=round(lt_batch/total_events,6), r_service=round(lt_service/total_events,6), r_remote_interactive=round(lt_remote_interactive/total_events,6), r_cached_interactive=round(lt_cached_interactive/total_events,6), r_network_cleartext=round(lt_network_cleartext/total_events,6), r_new_credentials=round(lt_new_credentials/total_events,6), r_failure=round(failure_count/total_events,6), r_off_hours=round(off_hours_events/total_events,6)\
| eval log_dest_hosts=round(log(dc_dest_hosts+1),6), log_src_hosts=round(log(dc_src_hosts+1),6), log_peer_size=round(log(ou_peer_size+1),6)\
| fillnull value=0 r_interactive,r_network,r_batch,r_service,r_remote_interactive,r_cached_interactive,r_network_cleartext,r_new_credentials,r_failure,r_off_hours,log_dest_hosts,log_src_hosts,log_peer_size,ou_depth\
| eventstats dc(logon_user) AS account_pool\
| where account_pool>=8\
| fields - account_pool\
| fit KMeans k=8 r_interactive r_network r_batch r_service r_remote_interactive r_cached_interactive r_network_cleartext r_new_credentials r_failure r_off_hours log_dest_hosts log_src_hosts ou_depth log_peer_size into app:ad_obj_peer_kmeans\
| stats count AS cluster_accounts, avg(r_interactive) AS avg_r_interactive, avg(r_network) AS avg_r_network, avg(r_service) AS avg_r_service, avg(r_remote_interactive) AS avg_r_remote_interactive, avg(r_failure) AS avg_r_failure, avg(r_off_hours) AS avg_r_off_hours, dc(user_ou) AS distinct_ous by cluster\
| eval model="ad_obj_peer_kmeans", model_version="1.0.0", algorithm="KMeans (k=8)", fit_completed=strftime(now(),"%Y-%m-%d %H:%M:%S")\
| foreach avg_* [ eval <<FIELD>>=round('<<FIELD>>',4) ]\
| table model,model_version,algorithm,fit_completed,cluster,cluster_accounts,distinct_ous,avg_r_interactive,avg_r_network,avg_r_service,avg_r_remote_interactive,avg_r_failure,avg_r_off_hours\
| sort cluster
disabled = 1

#- ML Model - daily peer-cluster deviation scoring of account logon behaviour -#
[AD_Obj_ML_PeerGroup_Apply]
action.email.useNSSubject = 1
alert.suppress = 0
alert.track = 0
cron_schedule = 35 2 * * *
description = ML model apply (daily 02:35). Rebuilds yesterday's per-account authentication profile with the same feature recipe as the fit, assigns each account to its peer cluster with the ad_obj_peer_kmeans model, then measures divergence from the peers. MLTK KMeans does not emit a distance-to-centroid, so the deviation is computed in SPL - eventstats gives the per-cluster mean and stdev of each of the 12 behavioural features, each feature is turned into a z-score, and peer_distance is the Euclidean norm of those z-scores. The two OU-structure features are used for clustering only, not for the deviation, so the score is behavioural. Accounts whose peer_distance is 3 or more stdev above their own cluster are written to AD_Obj_Risk as risk_type=peer_logon_deviation, MITRE T1078.002. Clusters with fewer than 5 members are skipped as statistically meaningless.
dispatch.earliest_time = -1d@d
dispatch.latest_time = @d
display.general.type = statistics
display.page.search.mode = fast
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 1
run_on_startup = false
request.ui_dispatch_app = ms_windows_ad_objects
request.ui_dispatch_view = search
search = index=`ms_ad_obj_ml_summary_index` feature_set=logon_type_vector\
| eval logon_user=lower(logon_user)\
| where isnotnull(logon_user) AND logon_user!=""\
| stats sum(total_events) AS total_events, sum(failure_count) AS failure_count, sum(off_hours_events) AS off_hours_events, sum(lt_interactive) AS lt_interactive, sum(lt_network) AS lt_network, sum(lt_batch) AS lt_batch, sum(lt_service) AS lt_service, sum(lt_remote_interactive) AS lt_remote_interactive, sum(lt_cached_interactive) AS lt_cached_interactive, sum(lt_network_cleartext) AS lt_network_cleartext, sum(lt_new_credentials) AS lt_new_credentials, max(dc_dest_hosts) AS dc_dest_hosts, max(dc_src_hosts) AS dc_src_hosts, dc(date_day) AS days_observed by logon_user\
| where total_events>=5\
| lookup AD_Obj_User lookup_usr AS logon_user OUTPUT OU AS user_ou, cn AS user_cn, domain AS user_domain, user_type AS user_type\
| eval user_ou=mvindex(user_ou,0), user_domain=mvindex(user_domain,0)\
| eval user_ou=if(isnull(user_ou) OR user_ou=="","UNRESOLVED",lower(user_ou))\
| eval ou_depth=mvcount(split(user_ou,","))\
| eventstats dc(logon_user) AS ou_peer_size by user_ou\
| eval r_interactive=round(lt_interactive/total_events,6), r_network=round(lt_network/total_events,6), r_batch=round(lt_batch/total_events,6), r_service=round(lt_service/total_events,6), r_remote_interactive=round(lt_remote_interactive/total_events,6), r_cached_interactive=round(lt_cached_interactive/total_events,6), r_network_cleartext=round(lt_network_cleartext/total_events,6), r_new_credentials=round(lt_new_credentials/total_events,6), r_failure=round(failure_count/total_events,6), r_off_hours=round(off_hours_events/total_events,6)\
| eval log_dest_hosts=round(log(dc_dest_hosts+1),6), log_src_hosts=round(log(dc_src_hosts+1),6), log_peer_size=round(log(ou_peer_size+1),6)\
| fillnull value=0 r_interactive,r_network,r_batch,r_service,r_remote_interactive,r_cached_interactive,r_network_cleartext,r_new_credentials,r_failure,r_off_hours,log_dest_hosts,log_src_hosts,log_peer_size,ou_depth\
| apply ad_obj_peer_kmeans\
| eventstats count AS cluster_size, avg(r_interactive) AS m_interactive, stdev(r_interactive) AS s_interactive, avg(r_network) AS m_network, stdev(r_network) AS s_network, avg(r_batch) AS m_batch, stdev(r_batch) AS s_batch, avg(r_service) AS m_service, stdev(r_service) AS s_service, avg(r_remote_interactive) AS m_remote_interactive, stdev(r_remote_interactive) AS s_remote_interactive, avg(r_cached_interactive) AS m_cached_interactive, stdev(r_cached_interactive) AS s_cached_interactive, avg(r_network_cleartext) AS m_network_cleartext, stdev(r_network_cleartext) AS s_network_cleartext, avg(r_new_credentials) AS m_new_credentials, stdev(r_new_credentials) AS s_new_credentials, avg(r_failure) AS m_failure, stdev(r_failure) AS s_failure, avg(r_off_hours) AS m_off_hours, stdev(r_off_hours) AS s_off_hours, avg(log_dest_hosts) AS m_dest_hosts, stdev(log_dest_hosts) AS s_dest_hosts, avg(log_src_hosts) AS m_src_hosts, stdev(log_src_hosts) AS s_src_hosts by cluster\
| where cluster_size>=5\
| eval z_interactive=if(isnull(s_interactive) OR s_interactive==0,0,(r_interactive-m_interactive)/s_interactive), z_network=if(isnull(s_network) OR s_network==0,0,(r_network-m_network)/s_network), z_batch=if(isnull(s_batch) OR s_batch==0,0,(r_batch-m_batch)/s_batch), z_service=if(isnull(s_service) OR s_service==0,0,(r_service-m_service)/s_service), z_remote_interactive=if(isnull(s_remote_interactive) OR s_remote_interactive==0,0,(r_remote_interactive-m_remote_interactive)/s_remote_interactive), z_cached_interactive=if(isnull(s_cached_interactive) OR s_cached_interactive==0,0,(r_cached_interactive-m_cached_interactive)/s_cached_interactive)\
| eval z_network_cleartext=if(isnull(s_network_cleartext) OR s_network_cleartext==0,0,(r_network_cleartext-m_network_cleartext)/s_network_cleartext), z_new_credentials=if(isnull(s_new_credentials) OR s_new_credentials==0,0,(r_new_credentials-m_new_credentials)/s_new_credentials), z_failure=if(isnull(s_failure) OR s_failure==0,0,(r_failure-m_failure)/s_failure), z_off_hours=if(isnull(s_off_hours) OR s_off_hours==0,0,(r_off_hours-m_off_hours)/s_off_hours), z_dest_hosts=if(isnull(s_dest_hosts) OR s_dest_hosts==0,0,(log_dest_hosts-m_dest_hosts)/s_dest_hosts), z_src_hosts=if(isnull(s_src_hosts) OR s_src_hosts==0,0,(log_src_hosts-m_src_hosts)/s_src_hosts)\
| eval peer_distance=round(sqrt(pow(z_interactive,2)+pow(z_network,2)+pow(z_batch,2)+pow(z_service,2)+pow(z_remote_interactive,2)+pow(z_cached_interactive,2)+pow(z_network_cleartext,2)+pow(z_new_credentials,2)+pow(z_failure,2)+pow(z_off_hours,2)+pow(z_dest_hosts,2)+pow(z_src_hosts,2)),4)\
| eventstats avg(peer_distance) AS m_distance, stdev(peer_distance) AS s_distance by cluster\
| eval peer_z=if(isnull(s_distance) OR s_distance==0,0,round((peer_distance-m_distance)/s_distance,4))\
| where peer_z>=3\
| eval risk_score=round(min(1,peer_z/10),4)\
| eval entity=logon_user, entity_type="user", risk_type="peer_logon_deviation", model="ad_obj_peer_kmeans", model_version="1.0.0", mitre_technique_id="T1078.002"\
| eval domain=if(isnull(user_domain) OR user_domain=="","NA",lower(user_domain))\
| eval evidence="peer_cluster=".cluster." (size ".cluster_size.", ou=".user_ou."); peer_distance=".peer_distance."; peer_z=".peer_z."; logon mix interactive/network/batch/service/rdp=".r_interactive."/".r_network."/".r_batch."/".r_service."/".r_remote_interactive."; failure_ratio=".r_failure."; off_hours_ratio=".r_off_hours."; dest_hosts=".dc_dest_hosts."; src_hosts=".dc_src_hosts."; events=".total_events\
| eval scored_day=strftime(relative_time(now(),"-1d@d"),"%Y-%m-%d")\
| eval first_seen=relative_time(now(),"-1d@d"), last_scored=now()\
| eval _key=risk_type.":".entity_type.":".entity.":".scored_day\
| table _key,entity,entity_type,domain,risk_type,risk_score,model,model_version,evidence,mitre_technique_id,first_seen,last_scored\
| outputlookup append=true key_field=_key AD_Obj_Risk
disabled = 1

#- ML Analytics - daily privilege-path (group nesting depth to Tier-0) refresh -#
[AD_Obj_ML_PrivPath_Update]
action.email.useNSSubject = 1
alert.suppress = 0
alert.track = 0
cron_schedule = 45 2 * * *
description = Privilege-path analytics (daily 02:45). Pure SPL graph feature - no MLTK required. Seeds on every AD_Obj_Group entry that the AD_Audit_Default_Critical_Objects lookup calls a critical group, or that carries adminCount=1 / isCriticalSystemObject=TRUE, then walks the group "member" attribute down four nesting levels with chained AD_Obj_Group lookups. Each hop is normalised into an (entity, depth, path) row and reduced to the minimum nesting depth per entity plus the number of distinct critical groups reachable. Results are written to the STAGING lookup ms_ad_obj_privpath_new so that AD_Obj_ML_PrivPath_Alert can diff them against the previous baseline before the baseline is overwritten. Depth 1 = direct member of a critical group.
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
display.general.type = statistics
display.page.search.mode = fast
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 1
run_on_startup = false
request.ui_dispatch_app = ms_windows_ad_objects
request.ui_dispatch_view = search
search = | inputlookup AD_Obj_Group\
| eval crit_cn=lower(cn)\
| lookup AD_Audit_Default_Critical_Objects cn AS crit_cn OUTPUT obj_type AS crit_obj_type, type_flag AS crit_type_flag, group_scope AS crit_group_scope\
| eval is_critical=if(crit_obj_type=="group" OR adminCount=="1" OR isCriticalSystemObject=="TRUE",1,0)\
| where is_critical=1\
| eval crit_dn=lower(dn), crit_domain=domain, m1=member\
| fields crit_cn,crit_dn,crit_domain,crit_type_flag,m1\
| eval m1=if(isnull(m1) OR m1=="","__none__",m1)\
| makemv delim="|" m1\
| mvexpand m1\
| eval d1_dn=if(m1=="__none__","__none__",lower(m1))\
| lookup AD_Obj_Group dn AS d1_dn OUTPUT cn AS d1_cn, member AS m2\
| eval d1_name=if(d1_dn=="__none__","__none__",if(isnotnull(d1_cn),lower(mvindex(d1_cn,0)),d1_dn))\
| eval p1=crit_cn." <- ".d1_name\
| eval m2=if(isnull(m2) OR m2=="" OR d1_dn=="__none__","__none__",m2)\
| makemv delim="|" m2\
| mvexpand m2\
| eval d2_dn=if(m2=="__none__","__none__",lower(m2))\
| lookup AD_Obj_Group dn AS d2_dn OUTPUT cn AS d2_cn, member AS m3\
| eval d2_name=if(d2_dn=="__none__","__none__",if(isnotnull(d2_cn),lower(mvindex(d2_cn,0)),d2_dn))\
| eval p2=p1." <- ".d2_name\
| eval m3=if(isnull(m3) OR m3=="" OR d2_dn=="__none__","__none__",m3)\
| makemv delim="|" m3\
| mvexpand m3\
| eval d3_dn=if(m3=="__none__","__none__",lower(m3))\
| lookup AD_Obj_Group dn AS d3_dn OUTPUT cn AS d3_cn, member AS m4\
| eval d3_name=if(d3_dn=="__none__","__none__",if(isnotnull(d3_cn),lower(mvindex(d3_cn,0)),d3_dn))\
| eval p3=p2." <- ".d3_name\
| eval m4=if(isnull(m4) OR m4=="" OR d3_dn=="__none__","__none__",m4)\
| makemv delim="|" m4\
| mvexpand m4\
| eval d4_dn=if(m4=="__none__","__none__",lower(m4))\
| lookup AD_Obj_Group dn AS d4_dn OUTPUT cn AS d4_cn\
| eval d4_name=if(d4_dn=="__none__","__none__",if(isnotnull(d4_cn),lower(mvindex(d4_cn,0)),d4_dn))\
| eval p4=p3." <- ".d4_name\
| eval hop=mvzip(mvzip(mvappend(d1_dn,d2_dn,d3_dn,d4_dn),mvappend("1","2","3","4"),"##"),mvappend(p1,p2,p3,p4),"##")\
| mvexpand hop\
| rex field=hop "^(?<entity_dn>.*?)##(?<path_depth>\d+)##(?<path>.*)$"\
| where entity_dn!="__none__" AND entity_dn!=crit_dn\
| eval path_depth=tonumber(path_depth)\
| eventstats values(crit_cn) AS crit_groups, dc(crit_cn) AS crit_group_reach by entity_dn\
| sort 0 entity_dn path_depth\
| dedup entity_dn\
| rename path_depth AS min_depth, path AS shortest_path\
| lookup AD_Obj_User dn AS entity_dn OUTPUT sAMAccountName AS u_sam, cn AS u_cn, domain AS u_domain\
| lookup AD_Obj_Group dn AS entity_dn OUTPUT cn AS g_cn, domain AS g_domain\
| eval u_sam=mvindex(u_sam,0), g_cn=mvindex(g_cn,0), u_domain=mvindex(u_domain,0), g_domain=mvindex(g_domain,0)\
| eval entity_type=case(isnotnull(u_sam),"user",isnotnull(g_cn),"group",true(),"other")\
| eval entity=lower(coalesce(u_sam,g_cn,entity_dn))\
| eval domain=coalesce(u_domain,g_domain,crit_domain,"NA")\
| eval crit_groups=mvjoin(crit_groups,";")\
| eval prev_min_depth="", path_change="", updated=now()\
| table entity,entity_type,entity_dn,domain,min_depth,crit_group_reach,crit_groups,shortest_path,prev_min_depth,path_change,updated\
| sort 0 min_depth,entity\
| outputlookup ms_ad_obj_privpath_new
disabled = 1

#- ML Analytics - daily privilege-path diff, baseline promotion and alerting -#
[AD_Obj_ML_PrivPath_Alert]
action.email.useNSSubject = 1
alert.suppress = 0
alert.track = 0
cron_schedule = 5 3 * * *
description = Privilege-path change detection (daily 03:05). Reads today's staging paths from ms_ad_obj_privpath_new, looks up the previous baseline in ms_ad_obj_privpath, classifies each entity as new_reach / depth_decreased / reach_increased / unchanged, PROMOTES the staged rows to the baseline lookup (outputlookup passes its input through, so the promotion happens before the pipeline narrows to changes), and only then writes the changed rows to AD_Obj_Risk. risk_score = depth weight ((5-depth)/4, so a direct member scores 1.0) multiplied by a change weight (new_reach 1.0, depth_decreased 0.9, reach_increased 0.6). MITRE T1098 for accounts, T1484 for a group newly nested under a Tier-0 group. Cold start - when the baseline lookup is still empty no risk rows are written, the first run just seeds the baseline.
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
display.general.type = statistics
display.page.search.mode = fast
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 1
run_on_startup = false
request.ui_dispatch_app = ms_windows_ad_objects
request.ui_dispatch_view = search
search = | inputlookup ms_ad_obj_privpath_new\
| fields entity,entity_type,entity_dn,domain,min_depth,crit_group_reach,crit_groups,shortest_path,updated\
| lookup ms_ad_obj_privpath entity_dn OUTPUT min_depth AS prev_min_depth, crit_group_reach AS prev_reach, shortest_path AS prev_path\
| eval min_depth=tonumber(min_depth), crit_group_reach=tonumber(crit_group_reach), prev_min_depth=tonumber(prev_min_depth), prev_reach=tonumber(prev_reach)\
| eval path_change=case(isnull(prev_min_depth),"new_reach",min_depth<prev_min_depth,"depth_decreased",isnotnull(prev_reach) AND crit_group_reach>prev_reach,"reach_increased",true(),"unchanged")\
| eval updated=now()\
| table entity,entity_type,entity_dn,domain,min_depth,crit_group_reach,crit_groups,shortest_path,prev_min_depth,path_change,updated\
| outputlookup ms_ad_obj_privpath\
| eventstats count(prev_min_depth) AS baseline_rows\
| where baseline_rows>0 AND path_change!="unchanged"\
| eval depth_weight=round((5-min_depth)/4,4)\
| eval change_weight=case(path_change=="new_reach",1.0,path_change=="depth_decreased",0.9,true(),0.6)\
| eval risk_score=round(depth_weight*change_weight,4)\
| eval risk_type="priv_path_change", model="ad_obj_privpath_spl", model_version="1.0.0"\
| eval mitre_technique_id=if(entity_type=="group","T1484","T1098")\
| eval evidence="path_change=".path_change."; min_depth=".min_depth." (previous ".if(isnull(prev_min_depth),"none",prev_min_depth)."); critical_groups_reachable=".crit_group_reach."; shortest_path=".shortest_path."; critical_groups=".crit_groups."; entity_dn=".entity_dn\
| eval scored_day=strftime(now(),"%Y-%m-%d")\
| eval first_seen=relative_time(now(),"@d"), last_scored=now()\
| eval _key=risk_type.":".entity_type.":".entity.":".scored_day\
| table _key,entity,entity_type,domain,risk_type,risk_score,model,model_version,evidence,mitre_technique_id,first_seen,last_scored\
| outputlookup append=true key_field=_key AD_Obj_Risk
disabled = 1

#- Model Ops - weekly retention purge of the AD_Obj_Risk KV Store collection -#
[AD_Obj_ML_Risk_Retention]
action.email.useNSSubject = 1
alert.suppress = 0
alert.track = 0
cron_schedule = 15 3 * * 0
description = Model ops - risk retention (weekly, Sunday 03:15). Rewrites the AD_Obj_Risk KV Store collection keeping only rows scored in the last 90 days, preserving the original _key values. Rows with a missing or non-numeric last_scored are also dropped as malformed. Adjust the -90d@d window to change retention. Runs before AD_Obj_ML_Drift_Check so the drift report reads the trimmed collection.
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
display.general.type = statistics
display.page.search.mode = fast
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 1
run_on_startup = false
request.ui_dispatch_app = ms_windows_ad_objects
request.ui_dispatch_view = search
search = | inputlookup AD_Obj_Risk\
| eval last_scored=tonumber(last_scored)\
| where isnotnull(last_scored) AND last_scored>=relative_time(now(),"-90d@d")\
| outputlookup key_field=_key AD_Obj_Risk\
| stats count AS retained_rows, dc(entity) AS retained_entities, dc(risk_type) AS retained_risk_types, min(last_scored) AS oldest_scored, max(last_scored) AS newest_scored\
| eval oldest_scored=strftime(oldest_scored,"%Y-%m-%d %H:%M:%S"), newest_scored=strftime(newest_scored,"%Y-%m-%d %H:%M:%S"), retention_window="90d", purged=strftime(now(),"%Y-%m-%d %H:%M:%S")\
| table purged,retention_window,retained_rows,retained_entities,retained_risk_types,oldest_scored,newest_scored
disabled = 1

#- Model Ops - weekly week-over-week score / outlier-rate drift check -#
[AD_Obj_ML_Drift_Check]
action.email.useNSSubject = 1
alert.suppress = 0
alert.track = 0
cron_schedule = 35 3 * * 0
description = Model ops - drift check (weekly, Sunday 03:35). Compares the current 7 days against the previous 7 days per risk_type using the AD_Obj_Risk collection. outlier_rate is risk rows per scored day, which normalises away a missed apply run. drift is flagged true when the rate moves by more than 3x in either direction week-over-week; a large positive shift usually means a stale model (re-fit) and a large negative shift usually means the feature searches or the fit stopped running. Also reports the mean risk_score shift per model.
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
display.general.type = statistics
display.page.search.mode = fast
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 1
run_on_startup = false
request.ui_dispatch_app = ms_windows_ad_objects
request.ui_dispatch_view = search
search = | inputlookup AD_Obj_Risk\
| eval last_scored=tonumber(last_scored), risk_score=tonumber(risk_score)\
| where isnotnull(last_scored) AND last_scored>=relative_time(now(),"-14d@d")\
| eval week_bucket=if(last_scored>=relative_time(now(),"-7d@d"),"current","prior")\
| eval scored_day=strftime(last_scored,"%Y-%m-%d")\
| stats count AS risk_rows, dc(entity) AS entities, dc(scored_day) AS scored_days, avg(risk_score) AS avg_risk_score, values(model) AS model, values(model_version) AS model_version by risk_type,week_bucket\
| eval outlier_rate=round(risk_rows/max(scored_days,1),4)\
| stats max(eval(if(week_bucket=="current",outlier_rate,null()))) AS current_rate, max(eval(if(week_bucket=="prior",outlier_rate,null()))) AS prior_rate, max(eval(if(week_bucket=="current",entities,null()))) AS current_entities, max(eval(if(week_bucket=="prior",entities,null()))) AS prior_entities, max(eval(if(week_bucket=="current",avg_risk_score,null()))) AS current_avg_score, max(eval(if(week_bucket=="prior",avg_risk_score,null()))) AS prior_avg_score, values(model) AS model, values(model_version) AS model_version by risk_type\
| fillnull value=0 current_rate,prior_rate,current_entities,prior_entities,current_avg_score,prior_avg_score\
| eval rate_ratio=case(prior_rate==0 AND current_rate==0,1,prior_rate==0,99,true(),round(current_rate/prior_rate,4))\
| eval drift=if(rate_ratio>3 OR rate_ratio<0.3333,"true","false")\
| eval drift_direction=case(rate_ratio>3,"increase",rate_ratio<0.3333,"decrease",true(),"stable")\
| eval current_avg_score=round(current_avg_score,4), prior_avg_score=round(prior_avg_score,4)\
| eval score_delta=round(current_avg_score-prior_avg_score,4)\
| eval model=mvjoin(model,";"), model_version=mvjoin(model_version,";")\
| eval checked=strftime(now(),"%Y-%m-%d %H:%M:%S")\
| table risk_type,model,model_version,drift,drift_direction,rate_ratio,current_rate,prior_rate,current_entities,prior_entities,current_avg_score,prior_avg_score,score_delta,checked\
| sort - rate_ratio
disabled = 1

###################################################################################
#####          Model Evaluation Harness - Phase 3 (v5.0.0)                    #####
#####  Scores the Phase 1 models against the labeled ground-truth scenarios in #####
#####       lookups/ms_ad_obj_ml_evalset.csv (transforms stanza                #####
#####       ms_ad_obj_ml_evalset).  The eval set is the AD-side consumer of    #####
#####       the batch_data_eventgen labeled-corpus ground-truth manifest, so   #####
#####       the numbers are only meaningful when AD_Obj_Risk was populated by  #####
#####       a replay of that corpus - NOT on live production data, where the   #####
#####       unlabeled entities dominate.                                       #####
#####  Ship-disabled (disabled = 1).  Weekly, Sunday 03:45 - after the 03:35   #####
#####       drift check and clear of every other AD_Obj_ML_* schedule.         #####
###################################################################################

#- Model Ops - weekly precision / recall / F1 of each model against the eval set -#
[AD_Obj_ML_Eval_Score]
action.email.useNSSubject = 1
action.summary_index = 1
action.summary_index._name = summary
action.summary_index.feature_set = model_eval_scores
action.summary_index.report = AD_Obj_ML_Eval_Score
alert.suppress = 0
alert.track = 0
cron_schedule = 45 3 * * 0
description = Model evaluation (weekly, Sunday 03:45). Joins the labeled ground-truth scenarios in ms_ad_obj_ml_evalset against the last 30 days of AD_Obj_Risk and reports true_positives, false_positives, false_negatives, true_negatives, precision, recall and F1 per risk_type. Matching is on risk_type plus a normalised entity (lowercased, DOMAIN\\ prefix stripped) because change_velocity writes DOMAIN\\account while the other two models write the bare account name. Detections whose entity is not in the eval set at all are counted separately as false_positives_unlabeled and folded into precision_incl_unlabeled - on a clean labeled corpus replay that column is the honest precision; on live data it is meaningless and only precision/recall/f1 over the labeled entities should be read. Rows are written to the summary index tagged feature_set=model_eval_scores so the scores can be trended release over release. No MLTK required - this search only reads the KV Store risk collection and a CSV lookup.
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
display.general.type = statistics
display.page.search.mode = fast
display.page.search.tab = statistics
display.visualizations.show = 0
enableSched = 1
run_on_startup = false
request.ui_dispatch_app = ms_windows_ad_objects
request.ui_dispatch_view = search
search = | inputlookup ms_ad_obj_ml_evalset\
| eval entity_norm=lower(mvindex(split(entity,"\\"),-1))\
| eval label=case(lower(expected_detection)=="true","positive",lower(expected_detection)=="false","negative",true(),"unlabeled")\
| where label!="unlabeled"\
| fields scenario_id,risk_type,entity_norm,label,severity\
| append\
    [| inputlookup AD_Obj_Risk\
    | eval last_scored=tonumber(last_scored), risk_score=tonumber(risk_score)\
    | where isnotnull(last_scored) AND last_scored>=relative_time(now(),"-30d@d")\
    | eval entity_norm=lower(mvindex(split(entity,"\\"),-1))\
    | stats max(risk_score) AS detected_score, count AS detected_rows by risk_type,entity_norm]\
| stats values(scenario_id) AS scenario_id, values(label) AS label, values(severity) AS severity, max(detected_score) AS detected_score, sum(detected_rows) AS detected_rows by risk_type,entity_norm\
| eval detected=if(isnull(detected_score),0,1), labeled=if(isnull(label),0,1)\
| eval outcome=case(label=="positive" AND detected==1,"TP",label=="positive" AND detected==0,"FN",label=="negative" AND detected==1,"FP",label=="negative" AND detected==0,"TN",labeled==0 AND detected==1,"FP_UNLABELED",true(),"NA")\
| stats count(eval(outcome=="TP")) AS true_positives, count(eval(outcome=="FP")) AS false_positives, count(eval(outcome=="FN")) AS false_negatives, count(eval(outcome=="TN")) AS true_negatives, count(eval(outcome=="FP_UNLABELED")) AS false_positives_unlabeled, count(eval(labeled==1)) AS labeled_scenarios, sum(detected_rows) AS risk_rows_matched by risk_type\
| eval precision=if((true_positives+false_positives)==0,null(),round(true_positives/(true_positives+false_positives),4))\
| eval recall=if((true_positives+false_negatives)==0,null(),round(true_positives/(true_positives+false_negatives),4))\
| eval f1=if(isnull(precision) OR isnull(recall) OR (precision+recall)==0,null(),round(2*precision*recall/(precision+recall),4))\
| eval precision_incl_unlabeled=if((true_positives+false_positives+false_positives_unlabeled)==0,null(),round(true_positives/(true_positives+false_positives+false_positives_unlabeled),4))\
| eval false_positive_rate=if((false_positives+true_negatives)==0,null(),round(false_positives/(false_positives+true_negatives),4))\
| eval model=case(risk_type=="change_velocity","ad_obj_change_velocity_df",risk_type=="peer_logon_deviation","ad_obj_peer_kmeans",risk_type=="priv_path_change","ad_obj_privpath_spl",true(),"unmapped")\
| eval feature_set="model_eval_scores", eval_version="1.0.0", eval_window="-30d@d", evaluated=strftime(now(),"%Y-%m-%d %H:%M:%S")\
| fillnull value=0 risk_rows_matched\
| table evaluated,feature_set,eval_version,eval_window,risk_type,model,labeled_scenarios,true_positives,false_positives,false_negatives,true_negatives,false_positives_unlabeled,precision,recall,f1,precision_incl_unlabeled,false_positive_rate,risk_rows_matched\
| sort risk_type
disabled = 1
